[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hr-directory-identity-sync"
version = "0.1.0"
description = "Policy-driven HR to hybrid directory reconciliation with offline mock providers"
requires-python = ">=3.10"

[project.scripts]
hr-directory-sync = "hr_directory_sync.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
