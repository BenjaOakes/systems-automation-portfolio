[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "saas-to-itsm-inventory-sync"
version = "0.1.0"
description = "Provider-neutral inventory reconciliation and dry-run payload generation"
requires-python = ">=3.10"

[project.scripts]
itsm-inventory-sync = "itsm_sync.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
