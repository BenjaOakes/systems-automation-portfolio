[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "identity-address-migration-planner"
version = "0.1.0"
description = "Offline, collision-aware UPN and primary-email migration planning"
requires-python = ">=3.10"

[project.scripts]
identity-address-plan = "identity_planner.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
